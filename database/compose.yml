services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rutasur
      POSTGRES_USER: rutasur
      POSTGRES_PASSWORD: rutasur_dev
    ports:
      - "5432:5432"
    volumes:
      - rutasur_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rutasur"]
      interval: 5s
      retries: 10
volumes:
  rutasur_data:
