server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./../database/data/rutasur;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update # Solo prototipo. En producción usar Flyway/Liquibase.
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
